name: Deploy Auth Manager to Dev Environment

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: DEV

    env:
      DB_URL: ${{ secrets.TANTE_MAIN_DB_URL }}
      DB_USERNAME: ${{ secrets.AUTH_MANAGER_DB_USERNAME}}
      DB_PASSWORD: ${{ secrets.AUTH_MANAGER_DB_PASSWORD }}
      SERVER_PORT: 8081

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker (local build only)
        run: echo "Building Docker image..."

      - name: Build Docker image
        run: docker buildx build --platform linux/amd64 -t auth-manager:dev --load .

      - name: Save Docker image as tar
        run: docker save auth-manager:dev | gzip > auth-manager.tar.gz

      - name: Copy image to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TANTE_MAIN_SERVER_EC2_HOST_NAME }}
          username: ${{ secrets.TANTE_MAIN_SERVER_EC2_USER }}
          key: ${{ secrets.TANTE_MAIN_SERVER_EC2_SECRETE_KEY }}
          source: "auth-manager.tar.gz"
          target: "/home/ubuntu/auth-manager"

      - name: Deploy on EC2
        run: |
          echo "${{ secrets.TANTE_MAIN_SERVER_EC2_SECRETE_KEY }}" > private_key
          chmod 600 private_key

          ssh -o StrictHostKeyChecking=no -i private_key \
          ${{ secrets.TANTE_MAIN_SERVER_EC2_USER }}@${{ secrets.TANTE_MAIN_SERVER_EC2_HOST_NAME }} \
          "DB_URL='${{ secrets.TANTE_MAIN_DB_URL }}' \
           DB_USERNAME='${{ secrets.AUTH_MANAGER_DB_USERNAME }}' \
           DB_PASSWORD='${{ secrets.AUTH_MANAGER_DB_PASSWORD }}' \
           bash -s" << 'EOF'

          set -e

          cd /home/ubuntu/auth-manager

          echo "Stopping old container..."
          sudo docker stop auth-manager || true
          sudo docker rm auth-manager || true

          echo "Loading new image..."
          gunzip -c auth-manager.tar.gz | sudo docker load

          echo "Starting new container..."
          sudo docker run -d \
            --name auth-manager \
            --restart always \
            -p 8081:8081 \
            -e DB_URL="$DB_URL" \
            -e DB_USERNAME="$DB_USERNAME" \
            -e DB_PASSWORD="$DB_PASSWORD" \
            auth-manager:dev

          EOF

          rm private_key