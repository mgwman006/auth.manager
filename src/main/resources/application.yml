spring:
  application:
    name: auth-manager
  
  # Servlet Configuration
  servlet:
    context-path: /auth-manager
  
  # Database Configuration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  
  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8081
  address: 0.0.0.0
  forward-headers-strategy: framework

# CORS Configuration
app:
  cors:
    allowed-origins: http://localhost:4176,http://localhost:8080,http://localhost:4173,http://192.168.1.81:4173,http://localhost:4173,http://localhost:4174,http://localhost:4175,https://www.auth.tante.tz,https://localhost:8081
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: Authorization,Content-Type,Accept,Origin
    exposed-headers: Authorization
    allow-credentials: true

